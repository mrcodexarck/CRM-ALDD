<div class="table-toolbar">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Nombre, Identificación...">
    </div>
    <button id="btn-crear" class="btn-primary">Crear</button>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th><input type="checkbox"></th>
                <th>NOMBRE</th>
                <th>ESTADO</th>
                <th>PROPIETARIO</th>
                <th>E-MAIL</th>
                <th>TELÉFONO</th>
                <th>ETIQUETAS</th>
                <th>ÚLTIMA ACTIVIDAD</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="clientes-tbody">
            <tr><td colspan="9" style="text-align:center; padding: 20px;">Cargando datos de Firebase...</td></tr>
        </tbody>
    </table>
</div>

<!-- MODAL PARA CREAR / EDITAR CLIENTE -->
<div class="modal-overlay" id="modal-cliente">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Nuevo Posible Cliente</h2>
            <button class="btn-close" id="btn-cerrar-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <form id="form-cliente">
            <div id="modal-error-message" class="error-message" style="display: none;"></div>

            <div class="form-group">
                <label for="input-nombre">Nombre completo *</label>
                <input type="text" id="input-nombre" required placeholder="Ej. Juan Pérez">
            </div>
            
            <div class="form-group">
                <label for="input-email">Correo Electrónico</label>
                <input type="email" id="input-email" placeholder="juan@correo.com">
            </div>
            
            <div class="form-group">
                <label for="input-telefono">Teléfono</label>
                <input type="text" id="input-telefono" placeholder="+57 300 123 4567">
            </div>

            <div class="form-group">
                <label for="input-propietario">Propietario</label>
                <input type="text" id="input-propietario" placeholder="Nombre del vendedor">
            </div>
            
            <div class="form-group">
                <label for="input-estado">Estado</label>
                <select id="input-estado">
                    <option value="Nuevo">Nuevo</option>
                    <option value="Contactado">Contactado</option>
                    <option value="Calificado">Calificado</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-primary" id="btn-guardar">Guardar Cliente</button>
            </div>
        </form>
    </div>
</div>
